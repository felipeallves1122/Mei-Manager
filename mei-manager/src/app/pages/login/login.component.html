<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <span class="logo-icon">📊</span>
      <h2>MeiManager</h2>
      <p>Faça login para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" formControlName="email" placeholder="Seu e-mail">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" formControlName="password" placeholder="Sua senha">
      </div>

      <div class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</div>

      <div style="display: flex; gap: 1rem;">
        <button type="submit" [disabled]="loginForm.invalid" class="btn-primary" style="flex: 1;">Entrar</button>
        <button type="button" [disabled]="loginForm.invalid" class="btn-secondary" style="flex: 1; border: 1px solid var(--primary-color); background: transparent; color: var(--primary-color); padding: 0.875rem; border-radius: var(--radius-md); font-weight: 600; cursor: pointer;" (click)="onRegister()">Registrar</button>
      </div>
    </form>
    
    <div class="login-footer">
      <p>Crie uma conta para sincronizar seus dados no banco de dados.</p>
    </div>
  </div>
</div>
